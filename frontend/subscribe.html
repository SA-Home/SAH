<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter | SA Homeschooling &amp; Beyond</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ad-strip top-ad" aria-label="Advertisement">
    <div id="ad-top-leaderboard" class="google-ad-slot google-ad-slot--leaderboard" data-ad-unit="newspack_below_header"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="SA Homeschooling home">
        <span class="brand-small">sa</span>
        <span class="brand-home">Home</span><span class="brand-school">schooling</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="articles.html">Education</a>
        <a href="articles.html">Development</a>
        <a href="articles.html">Parenting</a>
        <a href="about.html">Directory</a>
        <a href="podcasts.html">Magazines</a>
        <a href="subscribe.html">Subscribe</a>
        <a class="search-link" href="articles.html" aria-label="Search">Search</a>
      </nav>
    </div>
  </header>

  <main class="newsletter-page">
    <section class="newsletter-panel">
      <h1>Newsletter</h1>
      <form class="compact-form">
        <div class="field-row">
          <label for="first-name">Name</label>
          <input id="first-name" name="first-name" type="text" placeholder="Name">
        </div>
        <div class="field-row">
          <label for="last-name">Last name</label>
          <input id="last-name" name="last-name" type="text" placeholder="Last name">
        </div>
        <div class="field-row">
          <label for="email">Email address:</label>
          <input id="email" name="email" type="email" placeholder="Your email address" required>
        </div>
        <button class="signup-button" type="submit">Sign up</button>
      </form>
    </section>

    <div class="ad-strip lower-ad" aria-label="Advertisement">
      <div id="ad-newsletter-leaderboard" class="google-ad-slot google-ad-slot--leaderboard" data-ad-unit="newspack_newsletter_footer"></div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
