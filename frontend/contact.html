<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | SA Homeschooling &amp; Beyond</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ad-strip top-ad" aria-label="Advertisement">
    <div id="ad-top-leaderboard" class="google-ad-slot google-ad-slot--leaderboard" data-ad-unit="newspack_below_header"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="SA Homeschooling home">
        <span class="brand-small">sa</span>
        <span class="brand-home">Home</span><span class="brand-school">schooling</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="articles.html">Education</a>
        <a href="articles.html">Development</a>
        <a href="articles.html">Parenting</a>
        <a href="about.html">Directory</a>
        <a href="podcasts.html">Magazines</a>
        <a href="subscribe.html">Subscribe</a>
        <a class="search-link" href="articles.html" aria-label="Search">Search</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <section class="page-header">
      <h1>Contact</h1>
      <p>Send a message to the SA Homeschooling team.</p>
    </section>
    <form class="contact-form">
      <label for="name">Name</label>
      <input id="name" type="text" placeholder="Your name">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com">
      <label for="message">Message</label>
      <textarea id="message" rows="6" placeholder="How can we help?"></textarea>
      <button class="signup-button" type="submit">Send message</button>
    </form>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
